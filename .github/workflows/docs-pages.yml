name: Docs Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'console/src/**'
      - 'console/vite.config.ts'
      - 'scripts/build-docs-site.ts'
      - 'scripts/gen-demo-bundle.ts'
      - 'scripts/gen-docs-reference.ts'
      - 'assets/tycho-logo*'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Build relative-path Console SPA for interactive Demo
        env:
          TYCHO_CONSOLE_BASE: './'
        run: npm --prefix console run build

      - name: Build static website, interactive demo, and docs
        run: node scripts/build-docs-site.ts

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
