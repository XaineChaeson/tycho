name: CI

# Manual trigger only so frequent releases do not burn CI quota or create noise.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-and-console:
    name: Server & Console (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Typecheck server & CLI
        run: npm run typecheck

      - name: Build web console
        run: npm run build:console

      - name: Test web console
        run: npm run test:console

      - name: Test server & CLI
        run: npm test

      - name: Verify OSS hygiene & generated references
        shell: bash
        run: |
          if [ -f scripts/check-oss-hygiene.ts ]; then
            node scripts/check-oss-hygiene.ts
          fi
          if [ -f scripts/gen-docs-reference.ts ]; then
            node scripts/gen-docs-reference.ts --check
          fi
          if [ -f scripts/gen-third-party-notices.ts ]; then
            node scripts/gen-third-party-notices.ts --check
          fi

  desktop-rust:
    name: Desktop Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Run Rust unit tests
        working-directory: desktop/src-tauri
        run: cargo test
