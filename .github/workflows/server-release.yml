name: Server Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Pack & Publish Server Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full history for commit-count versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web console
        run: npm run build:console

      - name: Generate third-party notices
        run: node scripts/gen-third-party-notices.ts

      - name: Pack release archive
        id: pack
        shell: bash
        run: |
          archive=$(node scripts/pack.ts --strict-licenses)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          cp "$archive" release-artifacts/tycho.tar.gz
          cp install/install.sh release-artifacts/install.sh
          cp install/install.ps1 release-artifacts/install.ps1
          (
            cd release-artifacts
            sha256sum tycho.tar.gz install.sh install.ps1 > SHA256SUMS
            cat SHA256SUMS
          )
          ls -lh release-artifacts

      - name: Upload staged release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tycho-server-release
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tycho ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          body: |
            ## Tycho Server ${{ github.ref_name }}

            - **One-line install (macOS / Linux)**: `curl -fsSL https://github.com/XaineChaeson/tycho/releases/latest/download/install.sh | bash`
            - **One-line install (Windows PowerShell)**: `irm https://github.com/XaineChaeson/tycho/releases/latest/download/install.ps1 | iex`
            - **Desktop Thin-Shell Client (`.exe` / `.dmg` / `.deb` / `.AppImage`)**: Published separately under [`app-v*` Desktop Releases](https://github.com/XaineChaeson/tycho/releases) so desktop releases never override the server `Latest` installer pointer.
            - **Website & Docs**: https://xainechaeson.github.io/tycho/
          files: release-artifacts/*
