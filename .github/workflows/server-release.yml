name: Server Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Pack & Publish Server Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (full history for commit-count versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci

      - name: Install console dependencies
        run: npm --prefix console ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web console
        run: npm run build:console

      - name: Run web console tests
        run: npm run test:console

      - name: Run server & CLI tests
        run: npm test

      - name: Verify OSS hygiene, docs & third-party notices
        run: |
          npm run check:hygiene
          npm run docs:check
          node scripts/gen-third-party-notices.ts --check

      - name: Pack release archive
        id: pack
        shell: bash
        run: |
          build_args=()
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            build_args=(--build "${BASH_REMATCH[1]}")
          fi
          archive=$(node scripts/pack.ts --strict-licenses "${build_args[@]}")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            expected_ver="${GITHUB_REF_NAME#v}"
            actual_ver=$(tar -xOf "$archive" release.json | node -e "console.log(JSON.parse(require('node:fs').readFileSync(0,'utf8')).version)")
            if [ "$actual_ver" != "$expected_ver" ]; then
              echo "Version mismatch: tag=${expected_ver}, archive=${actual_ver}" >&2
              exit 1
            fi
          fi
          mkdir -p release-artifacts
          cp "$archive" release-artifacts/tycho.tar.gz
          cp install/install.sh release-artifacts/install.sh
          cp install/install.ps1 release-artifacts/install.ps1
          (
            cd release-artifacts
            sha256sum tycho.tar.gz install.sh install.ps1 > SHA256SUMS
            cat SHA256SUMS
          )
          ls -lh release-artifacts

      - name: Upload staged release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tycho-server-release
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tycho ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          body: |
            ## Tycho Server ${{ github.ref_name }}

            - **One-line install (macOS / Linux)**: `curl -fsSL https://github.com/XaineChaeson/tycho/releases/latest/download/install.sh | bash`
            - **One-line install (Windows PowerShell)**: `irm https://github.com/XaineChaeson/tycho/releases/latest/download/install.ps1 | iex`
            - **Desktop Thin-Shell Client (`.exe` / `.dmg` / `.deb` / `.AppImage`)**: Published separately under [`app-v*` Desktop Releases](https://github.com/XaineChaeson/tycho/releases) so desktop releases never override the server `Latest` installer pointer.
            - **Website & Docs**: https://xainechaeson.github.io/tycho/
          files: release-artifacts/*
