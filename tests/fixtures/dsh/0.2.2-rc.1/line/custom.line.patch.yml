# Written by tycho from the account's line. The key is not here: the round is handed it
# in its environment, and the stored-credential services stay off so nothing kept on this
# machine is used instead.
- id: credentials
  disabled: true
- id: authorization
  disabled: true
- id: deepseek-account
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      tycho:
        apiKeyEnv: TYCHO_DSH_API_KEY
        api: openai-completions
        baseURL: "http://127.0.0.1:53998/v1"
        retryPolicy:
          mode: normal
          maxRetries: 2
        defaultContextWindow: 200000
        models:
          - id: "fake-model"
            input: [text, image]
            reasoningEfforts:
              "off": null
              "high": "high"
              "max": "max"
          - id: "fake-model-2"
